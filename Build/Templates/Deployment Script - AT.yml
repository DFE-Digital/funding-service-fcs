  - task: FileTransform@1
    displayName: 'Contract Management Domain Contract Management Service Tests appsettings.json - Update Key Vault Secrets'
    inputs:
      folderPath: '$(Build.SourcesDirectory)\ContractManagementDomain\ContractManagementService.Tests\'
      targetFiles: '**\*.json'
      fileType: json

  - script: echo "name is $(EnvName)"
  - powershell: |
      if ('$(BuildConfiguration)'.ToLower() -in 'release','oat','doat') {
        throw "Incorrect Deployment Script.yml file, this is for dev/test only"
      }
    displayName: Verify correct deployment scripts in use

  - powershell: |
      if ('$(BuildConfiguration)'.ToLower() -in 'ci','at') {
         Write-Host ArtifactFeedName value FCT/RB1      
         Write-Host "##vso[task.setvariable variable=ArtifactFeedName]FCT/RB1"
      } else {
         Write-Host ArtifactFeedName value $(ArtifactFeedName)
      }
    displayName: Set artifact feed name

  - powershell: |
      if ('$(BuildConfiguration)'.ToLower() -in 'dci','ci') {
        Write-Host ShouldBuild value Y      
        Write-Host "##vso[task.setvariable variable=ShouldBuild]Y"
      } else {
        Write-Host ShouldBuild value $(ShouldBuild)
      }
    displayName: Set ShouldBuild

  - template: 'Build Deployed Artefacts - v2.yml'
    parameters:
      ClassicSubscription: SFA-FCS-Dev
      BuildRoot: $(Build.SourcesDirectory)
      ArtifactFeedName: $(ArtifactFeedName)
      ShouldBuild: $(ShouldBuild)

  - template: 'Deploy Artefact - v2.yml'
    parameters:
      StageFolder: $(Build.ArtifactStagingDirectory)/$(BuildConfiguration)
      ClassicSubscription: SFA-FCS-Dev
      AppStorageAccount: fcsappstoragedev
      ARMSubscription: SFA-FCS-Dev (ARM)
      AppNamePrefix: 'fcs-dev-'

  - template: 'Deploy App Services.yml'
    parameters:
      StageFolder: $(Build.ArtifactStagingDirectory)/$(BuildConfiguration)
      AppStorageAccount: fcsappstoragedev
      ARMSubscription: SFA-FCS-Dev (ARM)

  - template: 'Build and Execute Tests.yml'
    parameters:
      BuildRoot: $(Build.SourcesDirectory)
      ArtifactFeedName: $(ArtifactFeedName)
      ShouldBuild: $(ShouldBuild)

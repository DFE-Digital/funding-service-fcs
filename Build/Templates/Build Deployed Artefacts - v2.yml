parameters:
  BuildRoot: ''
  CRMDeploymentMode: ''
  ClassicSubscription: ''
  ArtifactFeedName: ''
  ShouldBuild: ''

steps:

- task: PowerShell@2
  displayName: 'Unpack Build Control file into variables'
  inputs:
    targetType: filePath
    filePath: ${{ parameters.BuildRoot }}/Build/Scripts/Build-UnpackBuildControlFile.ps1
    arguments: -configuration  $(Release.EnvironmentName) -buildRoot "${{ parameters.BuildRoot }}" -BCOverride '$(BC_Override)'
  continueOnError: false

- template: 'Build Deployed Artefacts - FCSCore.yml'
  parameters:
    ClassicSubscription: SFA-FCS-Dev
    BuildRoot: $(Build.SourcesDirectory)
    ArtifactFeedName: $(ArtifactFeedName)
    ShouldBuild: $(ShouldBuild)

- task: CopyFiles@2
  displayName: 'Copy Build Scripts to ArtifactStagingDirectory'
  inputs:
    SourceFolder: '${{ parameters.BuildRoot }}/Build/Scripts'
    TargetFolder: '$(Build.ArtifactStagingDirectory)/Build/Scripts'
    CleanTargetFolder: true
  condition: and(succeeded(),  ne(variables['DeployAfterBuild'],'N'))

- task: NuGetToolInstaller@1
  displayName: 'Use NuGet 5.4.0'
  inputs:
    versionSpec: 5.4.0
  condition: and(succeeded(),  ne(variables['FunctionAppDeployment'],'Y'))

- task: NuGetToolInstaller@1
  displayName: 'Use NuGet 6.0.0'
  inputs:
    versionSpec: 6.0.0
  condition: and(succeeded(),  eq(variables['FunctionAppDeployment'],'Y'))

- task: UseDotNet@2
  displayName: 'Use .NET 8 SDK'
  inputs:
    packageType: sdk
    version: '8.0.x'

- powershell: |
    $msbuildPath = "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\MSBuild\Current\Bin"

    Write-Host "Adding Visual Studio MSBuild to PATH:"
    Write-Host $msbuildPath

    $env:PATH = "$msbuildPath;$env:PATH"

    Write-Host "MSBuild now resolves to:"
    Get-Command msbuild -ErrorAction Stop | Select-Object Source

    msbuild -version

    Write-Host "##vso[task.prependpath]$msbuildPath"
  displayName: 'Configure Visual Studio MSBuild'

- task: NuGetCommand@2
  displayName: 'NuGet restore for FCTCRMSolution'
  inputs:
    restoreSolution: '${{ parameters.BuildRoot }}/FCTCRMSolution/FCTCRMSolution.sln'
    restoreDirectory: '${{ parameters.BuildRoot }}/packages'
  condition: and(succeeded(), eq(variables['BC_CRM'], 'Y'))

- powershell: |
    $systemConfigDataFilePath = "${{ parameters.BuildRoot }}\FCTCRMSolution\CrossDomain.XrmSolutionBuild\ConfigData\SystemConfigData.xml"      
    $deploymentMode = "${env:CRMDEPLOYMENTMODE}"
    if ($deploymentMode -eq '') { $deploymentMode = 3 }
    Write-Host "This step will update the build mode for the CRM Deployment to ${deploymentMode}"
    $systemConfigDataFile = [System.IO.File]::ReadAllText($systemConfigDataFilePath)
    $match = [Regex]::Match($systemConfigDataFile, "(?s)(.*<DeploymentMode>.*<Value>)3(</Value>.*</DeploymentMode>.*)")
    if ($match.Success) {
      $groups=$match.Groups
      $newContents = $groups[1].Value + $deploymentMode + $groups[2].Value
      [System.IO.File]::WriteAllText($systemConfigDataFilePath, $newContents);
      Write-Output "CRM Deployment mode set to $deploymentMode"
    }
    else {
     throw "DeploymentMode node not found in SystemConfigData.xml file"
    }
  condition: and(succeeded(), eq(variables['BC_CRM'], 'Y'))
  displayName: 'Update CRM Build Mode if given'

- task: MSBuild@1
  displayName: 'Build CRM Solution for $(BuildConfiguration)'
  inputs:
    solution: '${{ parameters.BuildRoot }}/FCTCRMSolution/FCTCRMSolution.sln'
    platform: '$(BuildSolutionPlatform)'
    configuration: '$(BuildConfiguration)'
    restoreNugetPackages: false
  condition: and(succeeded(), eq(variables['BC_CRM'], 'Y'))

- task: CopyFiles@2
  displayName: 'Copy FCTCRMSolution to ArtifactStagingDirectory for $(BuildConfiguration)'
  inputs:
    SourceFolder: '${{ parameters.BuildRoot }}/FCTCRMSolution\Build/$(BuildConfiguration)'
    TargetFolder: '$(Build.ArtifactStagingDirectory)/$(BuildConfiguration)/FCTCRMSolution'
    CleanTargetFolder: true
  condition: and(succeeded(),  ne(variables['DeployAfterBuild'],'N'), eq(variables['BC_CRM'], 'Y'))


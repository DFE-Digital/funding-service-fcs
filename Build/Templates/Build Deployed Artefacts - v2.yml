- task: UseDotNet@2
  displayName: 'Install .NET 8 SDK'
  inputs:
    packageType: 'sdk'
    version: '8.x'
    installationPath: $(Agent.ToolsDirectory)/dotnet

- task: DotNetCoreCLI@2
  displayName: 'Build Operations .Net Core Tests $(BuildConfiguration)'
  inputs:
    command: "build"
    projects: '${{ parameters.BuildRoot }}/FCT.Operations/FCT.Operations.Tests/FCT.Operations.Tests.csproj'
  condition: and(succeeded(), eq(variables['BC_OperationsWorker'], 'Y'))

- task: DotNetCoreCLI@2
  displayName: 'Build Operations .Net Core $(BuildConfiguration)'
  inputs:
    command: "build"
    projects: '${{ parameters.BuildRoot }}/FCT.Operations/Operations.Worker/Operations.Worker.csproj'
  condition: and(succeeded(), eq(variables['BC_OperationsWorker'], 'Y'))

- task: DotNetCoreCLI@2
  displayName: 'Build Operations .Net Core for $(BuildConfiguration) - create artifact'
  inputs:
    command: 'publish'
    publishWebProjects: false
    projects: '${{ parameters.BuildRoot }}/FCT.Operations/Operations.Worker/Operations.Worker.csproj'
    arguments: '--output ${{ parameters.BuildRoot }}/FCT.Operations/publish_output/App_Data/jobs/continuous/FCT.OperationsWebJob'
    zipAfterPublish: false
  condition: and(succeeded(), eq(variables['BC_OperationsWorker'], 'Y'))

- task: ArchiveFiles@2
  displayName: 'Build Operations .Net Core for $(BuildConfiguration) - zip artifact'
  inputs:
    rootFolderOrFile: '${{ parameters.BuildRoot }}/FCT.Operations/publish_output'
    includeRootFolder: false
    archiveType: 'zip'
    archiveFile: '${{ parameters.BuildRoot }}/FCT.Operations/publish/FCT.OperationsWebJob.zip'
    replaceExistingArchive: true
  condition: and(succeeded(), eq(variables['BC_OperationsWorker'], 'Y'))

- task: CopyFiles@2
  displayName: 'Copy Operations .Net Core for $(BuildConfiguration) - zipped artifact'
  inputs:
    SourceFolder: '${{ parameters.BuildRoot }}/FCT.Operations/publish'
    TargetFolder: '$(Build.ArtifactStagingDirectory)/$(BuildConfiguration)/FCT.Operations'
    CleanTargetFolder: true
  condition: and(succeeded(),  ne(variables['DeployAfterBuild'],'N'), eq(variables['BC_OperationsWorker'], 'Y'))

- task: NuGetCommand@2
  displayName: 'Install EntityFramework 6.2.0'
  inputs:
    command: 'custom'
    arguments: 'install EntityFramework -Version 6.2.0 -OutputDirectory $(Build.SourcesDirectory)/packages'

- task: CopyFiles@2
  displayName: 'Copy EF Migrate to ArtifactStagingDirectory'
  inputs:
    SourceFolder: '${{ parameters.BuildRoot }}/packages/EntityFramework.6.2.0/tools'
    Contents: migrate.exe
    TargetFolder: '$(Build.ArtifactStagingDirectory)/EntityFramework.Migrate'
  condition: and(succeeded(), ne(variables['DeployAfterBuild'],'N'), or(eq(variables['BC_CrossDomainIntegration'], 'Y'), eq(variables['BC_OperationsWorker'], 'Y')))

- task: DotNetCoreCLI@2
  displayName: 'Restore FCT.Operations.Web'
  inputs:
    command: 'restore'
    projects: '${{ parameters.BuildRoot }}/FCT.Operations.Web/FCT.Operations.Web.B.sln'
    feedsToUse: select
    includeNuGetOrg: true
  condition: and(succeeded(), eq(variables['BC_OperationsWeb'], 'Y'))

- task: DotNetCoreCLI@2
  displayName: 'Publish: Operations.Web for $(BuildConfiguration)'
  inputs:
    command: 'publish'
    publishWebProjects: false
    projects: '${{ parameters.BuildRoot }}/FCT.Operations.Web/Operations.Web/Operations.Web.csproj'
    arguments: '--configuration $(BuildConfiguration) --output ${{ parameters.BuildRoot }}/FCT.Operations.Web/Operations.Web/bin/$(BuildConfiguration)/net8.0/publish'
    zipAfterPublish: false
  condition: and(succeeded(), eq(variables['BC_OperationsWeb'], 'Y'))

- task: ArchiveFiles@2
  displayName: 'Package Operations.Web for $(BuildConfiguration)'
  inputs:
    rootFolderOrFile: '${{ parameters.BuildRoot }}/FCT.Operations.Web/Operations.Web/bin/$(BuildConfiguration)/net8.0/publish'
    includeRootFolder: false
    archiveType: 'zip'
    archiveFile: '${{ parameters.BuildRoot }}/FCT.Operations.Web/Operations.Web/Operations.Web.zip'
    replaceExistingArchive: true
  condition: and(succeeded(), eq(variables['BC_OperationsWeb'], 'Y'))

# we need this further build to create the test assembly
- task: VSBuild@1
  displayName: 'Build: Operations.Web solution for $(BuildConfiguration)'
  inputs:
    solution: '${{ parameters.BuildRoot }}/FCT.Operations.Web/FCT.Operations.Web.B.sln'
    msbuildArgs: '/p:TargetProfile=$(BuildConfiguration)'
    platform: '$(BuildSolutionPlatform)'
    configuration: '$(BuildConfiguration)'
  condition: and(succeeded(), eq(variables['BC_OperationsWeb'], 'Y'))

- task: CopyFiles@2
  displayName: 'Copy Operations.Web package to ArtifactStagingDirectory for $(BuildConfiguration)'
  inputs:
    SourceFolder: '${{ parameters.BuildRoot }}/FCT.Operations.Web/Operations.Web'
    Contents: 'Operations.Web.zip'
    TargetFolder: '$(Build.ArtifactStagingDirectory)/$(BuildConfiguration)/Operations.Web'

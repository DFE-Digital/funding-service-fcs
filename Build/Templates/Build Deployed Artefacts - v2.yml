  displayName: 'Build Operations .Net Core for $(BuildConfiguration) - zip artifact'
  inputs:
    rootFolderOrFile: '${{ parameters.BuildRoot }}/ContractManagementDomain/ContractManagementService/bin/$(BuildConfiguration)/net8.0/publish/'
    includeRootFolder: false
    archiveType: 'zip'
    archiveFile: '${{ parameters.BuildRoot }}/ContractManagementDomain/ContractManagementService/obj/$(BuildConfiguration)/Package/ContractManagementService.zip'
    replaceExistingArchive: true
  condition: and(succeeded(), eq(variables['BC_FCTServices'], 'Y'))

- task: CopyFiles@2
  displayName: 'Copy FCTServices to ArtifactStagingDirectory for $(BuildConfiguration)'
  inputs:
    SourceFolder: '${{ parameters.BuildRoot }}/ContractManagementDomain/ContractManagementService/obj/$(BuildConfiguration)/Package/'
    Contents: '*'
    TargetFolder: '$(Build.ArtifactStagingDirectory)/$(BuildConfiguration)/FCTServices'
    CleanTargetFolder: true
  condition: and(succeeded(), eq(variables['BC_FCTServices'], 'Y'))


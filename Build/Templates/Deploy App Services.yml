parameters:
  StageFolder: ''
  AppStorageAccount: ''
  ARMSubscription: ''
  AppNamePrefix: 'fcs-dev-'

steps:

# Azure App Service Deploy: Operations.Web
- task: AzureRmWebAppDeployment@4.240.2
  displayName: 'Azure App Service Deploy: Operations.Web'
  inputs:
    azureSubscription: ${{ parameters.ARMSubscription }}
    WebAppName: '${{ parameters.AppNamePrefix}}$(Release.EnvironmentName)-app-x-opsweb'
    packageForLinux: '${{ parameters.StageFolder }}/Operations.Web/Operations.Web.zip'
  continueOnError: false
  condition: and(succeeded(), ne(variables['DeployAfterBuild'],'N'), eq(variables['BC_OperationsWeb'], 'Y'))

# Update config via FileTransform task For Org Service.
- task: FileTransform@2
  displayName: 'XDomain.Worker.config- Update Key Vault Secrets'
  inputs:
    folderPath: '${{ parameters.StageFolder }}/OrganisationDomain/OrganisationDomain.Web.zip'
    xmlTargetFiles: |
      **\*.config
  condition: and(succeeded(), ne(variables['DeployAfterBuild'],'N'), eq(variables['BC_OrgDomain'], 'Y'))

# Azure App Service Deploy: OrganisationDomain.Azure.Deploy
- task: AzureRmWebAppDeployment@4.240.2
  displayName: 'Azure App Service Deploy: OrganisationDomain'
  inputs:
    azureSubscription: ${{ parameters.ARMSubscription }}
    WebAppName: '${{ parameters.AppNamePrefix}}$(Release.EnvironmentName)-app-org-webapi'
    packageForLinux: '${{ parameters.StageFolder }}/OrganisationDomain/OrganisationDomain.Web.zip'
  condition: and(succeeded(), ne(variables['DeployAfterBuild'],'N'), eq(variables['BC_OrgDomain'], 'Y'))

# Azure App Service Deploy: FCTServices
- task: AzureRmWebAppDeployment@4.240.2
  displayName: 'Azure App Service Deploy: FCTServices'
  inputs:
    azureSubscription: ${{ parameters.ARMSubscription }}
    WebAppName: '${{ parameters.AppNamePrefix}}$(Release.EnvironmentName)-app-x-fctservices'
    packageForLinux: '${{ parameters.StageFolder }}/FCTServices/ContractManagementService.zip'
  condition: and(succeeded(), ne(variables['DeployAfterBuild'],'N'), eq(variables['BC_FCTServices'], 'Y'))

# Azure App Service Deploy: FCS.Worker.Azure.Deploy
- task: AzureRmWebAppDeployment@4.240.2
  displayName: 'Azure App Service Deploy: FCS.Worker.Azure.WebJobsHostSite'
  inputs:
    azureSubscription: ${{ parameters.ARMSubscription }}
    WebAppName: '${{ parameters.AppNamePrefix}}$(Release.EnvironmentName)-app-x-fcsworker'
    packageForLinux: '${{ parameters.StageFolder }}/FCS.Worker.Azure.WebJobsHostSite/FCS.Worker.Azure.WebJobsHostSite.zip'
  condition: and(succeeded(), ne(variables['DeployAfterBuild'],'N'), eq(variables['BC_FCSWorker'], 'Y'))

# Azure App Service Deploy: CDI.Worker
- task: AzureRmWebAppDeployment@4.240.2
  displayName: 'Azure App Service Deploy: CrossDomain.Integration.WorkerSite'
  inputs:
    azureSubscription: ${{ parameters.ARMSubscription }}
    WebAppName: '${{ parameters.AppNamePrefix}}$(Release.EnvironmentName)-app-x-cdi'
    packageForLinux: '${{ parameters.StageFolder }}/CrossDomain.Integration.Azure.WorkerSite/CrossDomain.Integration.Azure.WorkerSite.zip'
  condition: and(succeeded(), ne(variables['DeployAfterBuild'],'N'), eq(variables['BC_CrossDomainIntegration'], 'Y'))

# Azure App Service Deploy: Operations.Azure.Deploy
- task: AzureRmWebAppDeployment@4.240.2
  displayName: 'Azure App Service Deploy: Operations.Azure.WebJobsHostSite'
  inputs:
    azureSubscription: ${{ parameters.ARMSubscription }}
    WebAppName: '${{ parameters.AppNamePrefix}}$(Release.EnvironmentName)-app-x-operations'
    packageForLinux: '${{ parameters.StageFolder }}/FCT.Operations/FCT.OperationsWebJob.zip'
  continueOnError: false
  condition: and(succeeded(), ne(variables['DeployAfterBuild'],'N'), eq(variables['BC_OperationsWorker'], 'Y'))

- task: AzureRmWebAppDeployment@4.240.2
  displayName: 'Azure App Service Deploy: FCS Core'
  inputs:
    azureSubscription: ${{ parameters.ARMSubscription }}
    WebAppName: '${{ parameters.AppNamePrefix}}$(Release.EnvironmentName)-app-funding-allocation'
    packageForLinux: '${{ parameters.StageFolder }}/FcsCore/FundingAllocationWebJob.zip'
  continueOnError: false
  condition: and(succeeded(), ne(variables['DeployAfterBuild'],'N'), eq(variables['BC_FcsCore'], 'Y'))

- task: AzureCLI@2
  displayName: Azure CLI - Start app service webjobs
  inputs:
    azureSubscription: ${{ parameters.ARMSubscription }}
    scriptType: ps
    scriptLocation: inlineScript
    inlineScript: |
      az webapp webjob continuous start --webjob-name XDomainWorkerRole --name ${{parameters.AppNamePrefix}}$(Release.EnvironmentName)-app-x-cdi --resource-group ${{parameters.AppNamePrefix}}$(Release.EnvironmentName)-rg
      az webapp webjob continuous start --webjob-name FCSWorkerRole --name ${{parameters.AppNamePrefix}}$(Release.EnvironmentName)-app-x-fcsworker --resource-group ${{parameters.AppNamePrefix}}$(Release.EnvironmentName)-rg
  condition: and(succeeded(), ne(variables['DeployAfterBuild'],'N'), eq(variables['BC_StartWorkers'], 'Y'))

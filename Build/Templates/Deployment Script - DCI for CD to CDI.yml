      targetFiles: '**\*.config'
      fileType: xml

  - task: FileTransform@1
    displayName: 'SpecFlow.IntegrationTests App.config - Update Key Vault Secrets'
    inputs:
      folderPath: '$(Build.SourcesDirectory)\SpecFlow.IntegrationTests\'
      targetFiles: '**\*.config'
      fileType: xml
  ##pranitha's debugging    

  - task: NuGetToolInstaller@1
    displayName: 'Use NuGet 6.x'
    inputs:
      versionSpec: 6.x

  
  - task: NuGetAuthenticate@1

  - task: DotNetCoreCLI@2
    displayName: 'DotNet Restore FCT.Console'
    inputs:
      command: 'restore'
      projects: 'FCT.Console/FCT.Console.B.sln'

  - task: DotNetCoreCLI@2
    displayName: 'DotNet restore CrossDomain.Integration'
    inputs:
      command: 'restore'
      projects: 'CrossDomain.Integration/CrossDomain.Integration.B.sln'    

  - task: PowerShell@2
    displayName: 'Verify CrossDomain restore'
    inputs:
      targetType: inline
      script: |
        $project = "$(Build.SourcesDirectory)\CrossDomain.Integration\ContractRequestDomain.Tests"

        Write-Host "Checking: $project"

        if (Test-Path "$project\obj\project.assets.json") {
          Write-Host "SUCCESS: project.assets.json exists"
          Write-Host "$project\obj\project.assets.json"
        }
        else {
          Write-Error "FAILED: project.assets.json does NOT exist"
        }   

  - task: PowerShell@2
    displayName: 'Check Assets Files After Restore'
    inputs:
      targetType: inline
      script: |
        Get-ChildItem "$(Build.SourcesDirectory)" -Recurse -Filter project.assets.json |
        ForEach-Object {
            Write-Host $_.FullName
        }

  - task: UseDotNet@2
    displayName: 'Install .NET 8 SDK'
    inputs:
      packageType: sdk
      version: '8.0.x'

  - task: PowerShell@2
    displayName: 'Verify project.assets.json'
    inputs:
      targetType: inline
      script: |
        $files = Get-ChildItem "$(Build.SourcesDirectory)\FCT.Console" -Recurse -Filter project.assets.json

        if ($files) {
            Write-Host "FOUND:"
            $files | ForEach-Object {
                Write-Host $_.FullName
            }
        }
        else {
            Write-Host "NO project.assets.json FILES FOUND"
        }

  - task: PowerShell@2
    displayName: 'DotNet Info'
    inputs:
      targetType: inline
      script: |
        dotnet --info    
   

  # - task: NuGetCommand@2
  #   displayName: 'NuGet restore FCT.Console'
  #   inputs:
  #     restoreSolution: FCT.Console/FCT.Console.B.sln
  #     restoreDirectory: '$(Build.SourcesDirectory)\Packages'

  # - task: NuGetCommand@2
  #   displayName: 'NuGet restore CrossDomain.Integration'
  #   inputs:
  #     restoreSolution: CrossDomain.Integration/CrossDomain.Integration.B.sln
  #     restoreDirectory: '$(Build.SourcesDirectory)\Packages'

  ##pranitha's debugging

  - task: VSBuild@1
    displayName: 'Build FCT.Console solution'
    inputs:
      solution: FCT.Console/FCT.Console.B.sln
      platform: '$(BuildSolutionPlatform)'
      configuration: '$(BuildConfiguration)'

  - task: CmdLine@2
    displayName: 'Deploy Document Templates'
    inputs:
      filename: '$(Build.SourcesDirectory)\FCT.Console\FCT.Console.Config\bin\$(BuildConfiguration)\FCT.Console.Config.exe'

  - task: VSBuild@1
    displayName: 'Build CrossDomain.Integration solution'
    inputs:
      solution: CrossDomain.Integration/CrossDomain.Integration.B.sln
      platform: '$(BuildSolutionPlatform)'
      configuration: '$(BuildConfiguration)'

  - task: InlinePowershell@1
    displayName: 'Execute Entity Framework Migrations'
    inputs:
      Script: "Set-Location $(Build.SourcesDirectory)/CrossDomain.Integration\\XDomain.Worker\\bin\\$(BuildConfiguration)


        Write-Host Running in (Get-Location)


        Copy-Item -Path ../../../../packages\\EntityFramework.6.2.0\\tools/migrate.exe -Destination migrate.exe


        # AllocationDeliveryDomain.Common contains migrations but doesn't follow the naming convention

        ((Get-ChildItem *.DataStore.dll).BaseName + 'AllocationDeliveryDomain.Common').foreach({


        \    write-host $_

        \    ./migrate.exe $_ /startupConfigurationFile=.\\XDomain.Worker.exe.config | Out-String | Set-Variable -name eferror\ 


        \    write-host $eferror

        \    if ($eferror.Contains(\"ERROR:\")) {

        \        Write-host \"ERROR FOUND, ABORTING.\"

        \        exit 1

        \    }

        })"

  - task: CmdLine@2
    displayName: 'Deploy Config for Pay Calc'
    inputs:
      filename: '$(Build.SourcesDirectory)\FCT.Console\FCT.Console.Config\bin\$(BuildConfiguration)\FCT.Console.Config.exe'

  - task: VSTest@2
    displayName: 'Test: Integration Tests'
    inputs:
      testAssemblyVer2: |
        **\$(BuildConfiguration)\*test*.dll
        !**\obj\**
        !**\$(BuildConfiguration)\lib\**
        !**\$(BuildConfiguration)\NServiceBus*.dll
        !**\$(BuildConfiguration)\Test*.dll
      searchFolder: '$(System.DefaultWorkingDirectory)\CrossDomain.Integration'
      testFiltercriteria: 'TestCategory=IntegrationTest'
      pathtoCustomTestAdapters: '$(System.DefaultWorkingDirectory)\CrossDomain.Integration'
      codeCoverageEnabled: true
      runSettingsFile: '$(System.DefaultWorkingDirectory)\CrossDomain.Integration\CodeCoverage.runsettings'
      platform: '$(BuildSolutionPlatform)'
      configuration: '$(BuildConfiguration)'
      rerunFailedTests: true

  - task: PublishCodeCoverageResults@2
    displayName: 'Publish Code Coverage Results'
    inputs:
      codeCoverageTool: 'Cobertura'
      summaryFileLocation: '$(Agent.TempDirectory)/**/coverage.cobertura.xml'

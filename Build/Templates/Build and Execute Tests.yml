  condition: and(succeeded(), and(eq(variables['BC_OperationsWorker'], 'Y'), eq(variables['RunUnitTests'], 'Y')))

- task: VSTest@2
  displayName: 'Test: Framework Unit Tests for Operations'
  inputs:
    testAssemblyVer2: |
     **\FCT.Operations\Fct.Operations.Cda.Tests\bin\$(BuildConfiguration)\**Tests.dll
     **\FCT.Operations\FCT.Operations.Integrity.Tests\bin\$(BuildConfiguration)\**Tests.dll
     !**\obj\**
    testFiltercriteria: 'TestCategory=UnitTest'
    pathtoCustomTestAdapters: '$(System.DefaultWorkingDirectory)\CrossDomain.Integration'
    codeCoverageEnabled: true
    runSettingsFile: '${{ parameters.BuildRoot }}\CrossDomain.Integration\CodeCoverage.runsettings'
    platform: '$(BuildPlatform)'
    configuration: '$(BuildConfiguration)'
    rerunFailedTests: true
    testRunTitle: 'Unit Tests'
  continueOnError: false
  condition: and(succeeded(), and(eq(variables['BC_OperationsWorker'], 'Y'), eq(variables['RunUnitTests'], 'Y')))
# Fct Operations Unit Tests END

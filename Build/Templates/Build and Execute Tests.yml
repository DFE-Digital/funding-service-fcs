parameters:
  BuildRoot: ''
  ArtifactFeedName: ''
  ShouldBuild: ''

steps:

- task: NuGetToolInstaller@1
  displayName: 'Use NuGet 5.4.0'
  inputs:
    versionSpec: 5.4.0
  condition: and(succeeded(), ne(variables['FunctionAppDeployment'],'Y'), or(eq(variables['RunAcceptanceTests'], 'Y'), eq(variables['RunIntegrationTests'], 'Y'), eq(variables['RunIntegrationTestsNightlyBuild'], 'Y'), eq(variables['RunCleanUpTests'], 'Y'), eq(variables['RunCRMConfigTests'], 'Y'), eq(variables['BuildAcceptanceTests'], 'Y')))

- task: NuGetToolInstaller@1
  displayName: 'Use NuGet 6.0.0'
  inputs:
    versionSpec: 6.0.0
  condition: and(succeeded(), eq(variables['FunctionAppDeployment'],'Y'), or(eq(variables['RunAcceptanceTests'], 'Y'), eq(variables['RunIntegrationTests'], 'Y'), eq(variables['RunIntegrationTestsNightlyBuild'], 'Y'), eq(variables['RunCleanUpTests'], 'Y'), eq(variables['RunCRMConfigTests'], 'Y'), eq(variables['BuildAcceptanceTests'], 'Y')))

- task: NuGetCommand@2
  displayName: 'NuGet restore for Contracts.AcceptanceTests'
  inputs:
    restoreSolution: 'Contracts.AcceptanceTests\Contracts.AcceptanceTests.sln'
    restoreDirectory: '${{ parameters.BuildRoot }}/packages'
  condition: and(succeeded(), or(eq(variables['RunAcceptanceTests'], 'Y'), eq(variables['BuildAcceptanceTests'], 'Y')))

- task: VSBuild@1
  displayName: 'Build solution Contracts.AcceptanceTests.sln'
  inputs:
    solution: 'Contracts.AcceptanceTests\Contracts.AcceptanceTests.sln'
    platform: '$(BuildSolutionPlatform)'
    configuration: '$(BuildConfiguration)'
  condition: and(succeeded(), or(eq(variables['RunAcceptanceTests'], 'Y'), eq(variables['BuildAcceptanceTests'], 'Y')))

- task: NuGetCommand@2
  displayName: 'NuGet restore for **/*.B.sln'
  inputs:
    restoreSolution: '**\*.B.sln'
    restoreDirectory: '${{ parameters.BuildRoot }}/packages'
  condition: and(succeeded(), or(eq(variables['RunIntegrationTests'], 'Y'), eq(variables['RunIntegrationTestsNightlyBuild'], 'Y'), eq(variables['RunCleanUpTests'], 'Y'), eq(variables['RunCRMConfigTests'], 'Y')))

- task: VSBuild@1
  displayName: 'Build all solutions with tests (*.B.sln)'
  inputs:
    solution: '**\*.B.sln'
    platform: '$(BuildSolutionPlatform)'
    configuration: '$(BuildConfiguration)'
  condition: and(succeeded(), or(eq(variables['RunIntegrationTestsNightlyBuild'], 'Y'), eq(variables['RunCleanUpTests'], 'Y'), eq(variables['RunCRMConfigTests'], 'Y')))

- task: VSBuild@1
  displayName: 'Build OrganisationDomain with tests'
  inputs:
    solution: '${{ parameters.BuildRoot }}/OrganisationDomain/OrganisationDomain.B.sln'
    platform: '$(BuildSolutionPlatform)'
    configuration: '$(BuildConfiguration)'
  condition: and(succeeded(), eq(variables['BC_OrgDomain'], 'Y'), eq(variables['RunIntegrationTests'],'Y'))
  
- task: DotNetCoreCLI@2
  displayName: 'Test: .NET Core Tests'
  inputs:
   command: test
   projects: '**/*Tests/FundingAllocation.Tests.csproj'
   arguments: '--configuration $(BuildConfiguration) --filter TestCategory=UnitTest|TestCategory=IntegrationTest --collect "Code Coverage"'
  condition: and(succeeded(), eq(variables['RunCoreTests'], 'Y')) 

- task: DotNetCoreCLI@2
  displayName: 'Test: FctServices .NET Core Tests'
  inputs:
    command: test
    projects: '${{ parameters.BuildRoot }}/FCTServices/FCTServices.sln'
    arguments: '--configuration $(BuildConfiguration) --filter TestCategory=UnitTest|TestCategory=IntegrationTest --collect "Code Coverage"'
  condition: and(succeeded(), eq(variables['RunIntegrationTests'], 'Y'), eq(variables['BC_FCTServices'], 'Y'))
    
- task: VSTest@2
  displayName: 'Test: Integration Tests'
  inputs:
    testAssemblyVer2: |
     **\$(BuildConfiguration)\**Tests.dll
     !**\obj\**
    testFiltercriteria: 'TestCategory=IntegrationTest&TestCategory!=ExternalDependency'
    pathtoCustomTestAdapters: '$(System.DefaultWorkingDirectory)\CrossDomain.Integration'
    codeCoverageEnabled: true
    runSettingsFile: '${{ parameters.BuildRoot }}\CrossDomain.Integration\CodeCoverage.runsettings'
    platform: '$(BuildSolutionPlatform)'
    configuration: '$(BuildConfiguration)'
    rerunFailedTests: true
    testRunTitle: 'Integration Tests'
  continueOnError: false
  condition: and(succeeded(), eq(variables['RunIntegrationTests'], 'Y'))

- task: VSTest@2
  displayName: 'Test: Integration Tests Nightly Build'
  inputs:
    testAssemblyVer2: |
     **\$(BuildConfiguration)\**Tests.dll
     !**\obj\**
    testFiltercriteria: 'TestCategory=IntegrationTestNightlyBuild'
    pathtoCustomTestAdapters: '$(System.DefaultWorkingDirectory)\FCT.Console'
    codeCoverageEnabled: true
    runSettingsFile: '${{ parameters.BuildRoot }}\CrossDomain.Integration\CodeCoverage.runsettings'
    platform: '$(BuildSolutionPlatform)'
    configuration: '$(BuildConfiguration)'
    rerunFailedTests: true
    testRunTitle: 'Integration Tests Nightly Build'
  continueOnError: true
  condition: and(succeeded(), eq(variables['RunIntegrationTestsNightlyBuild'], 'Y'))

- task: VSTest@2
  displayName: 'Test: Clean up Tests'
  inputs:
    testAssemblyVer2: |
     **\$(BuildConfiguration)\**TeamSiteTests.dll
     !**\obj\**
     !Build/drop/**
    pathtoCustomTestAdapters: '${{ parameters.BuildRoot }}\FCS.Worker'
    runInParallel: false
    codeCoverageEnabled: true
    runSettingsFile: '${{ parameters.BuildRoot }}\CrossDomain.Integration\CodeCoverage.runsettings'
    platform: '$(BuildSolutionPlatform)'
    configuration: '$(BuildConfiguration)'
    testRunTitle: 'Clean up Tests'
  continueOnError: true
  condition: and(succeeded(), eq(variables['RunCleanUpTests'], 'Y'))

- task: VSTest@2
  displayName: 'Test: Contracts Acceptance Tests (except Long2Run)'
  inputs:
    testAssemblyVer2: |
     **\bin\$(BuildConfiguration)\Contracts.AcceptanceTests.dll
     !Build/drop/*
    testFiltercriteria: (TestCategory=AcceptanceTest&TestCategory=Complete&TestCategory!=Long2Run)
    pathtoCustomTestAdapters: '${{ parameters.BuildRoot }}\packages\NUnitTestAdapter.1.2'
    runInParallel: false
    codeCoverageEnabled: true
    runSettingsFile: '${{ parameters.BuildRoot }}\CrossDomain.Integration\CodeCoverage.runsettings'
    platform: '$(BuildSolutionPlatform)'
    configuration: '$(BuildConfiguration)'
    rerunFailedTests: true
    rerunMaxAttempts: 1
    testRunTitle: 'Contracts Acceptance Tests (except Long2Run)'
  continueOnError: true
  condition: and(succeeded(), eq(variables['RunAcceptanceTests'], 'Y'))

- task: VSTest@2
  displayName: 'Test: Contracts Acceptance Tests (only Long2Run A100 - A399)'
  inputs:
    testAssemblyVer2: |
     **\bin\$(BuildConfiguration)\Contracts.AcceptanceTests.dll
     !Build/drop/*
    testFiltercriteria: (TestCategory=AcceptanceTest&TestCategory=Complete&TestCategory=Long2Run123)
    pathtoCustomTestAdapters: '${{ parameters.BuildRoot }}\packages\NUnitTestAdapter.1.2'
    runInParallel: false
    codeCoverageEnabled: true
    runSettingsFile: '${{ parameters.BuildRoot }}\CrossDomain.Integration\CodeCoverage.runsettings'
    platform: '$(BuildSolutionPlatform)'
    configuration: '$(BuildConfiguration)'
    rerunFailedTests: true
    rerunMaxAttempts: 1
    testRunTitle: 'Test: Contracts Acceptance Tests (only Long2Run A100 - A399)'
  continueOnError: true
  condition: and(succeeded(), eq(variables['RunAcceptanceTests'], 'Y'))

- task: VSTest@2
  displayName: 'Test: Contracts Acceptance Tests (only Long2Run A400 - A599)'
  inputs:
    testAssemblyVer2: |
     **\bin\$(BuildConfiguration)\Contracts.AcceptanceTests.dll
     !Build/drop/*
    testFiltercriteria: (TestCategory=AcceptanceTest&TestCategory=Complete&TestCategory=Long2Run45)
    pathtoCustomTestAdapters: '${{ parameters.BuildRoot }}\packages\NUnitTestAdapter.1.2'
    runInParallel: false
    codeCoverageEnabled: true
    runSettingsFile: '${{ parameters.BuildRoot }}\CrossDomain.Integration\CodeCoverage.runsettings'
    platform: '$(BuildSolutionPlatform)'
    configuration: '$(BuildConfiguration)'
    rerunFailedTests: true
    rerunMaxAttempts: 1
    testRunTitle: 'Test: Contracts Acceptance Tests (only Long2Run A400 - A599)'
  continueOnError: true
  condition: and(succeeded(), eq(variables['RunAcceptanceTests'], 'Y'))

- task: VSTest@2
  displayName: 'Test: Contracts Acceptance Tests (only Long2Run A600 - A799)'
  inputs:
    testAssemblyVer2: |
     **\bin\$(BuildConfiguration)\Contracts.AcceptanceTests.dll
     !Build/drop/*
    testFiltercriteria: (TestCategory=AcceptanceTest&TestCategory=Complete&TestCategory=Long2Run67)
    pathtoCustomTestAdapters: '${{ parameters.BuildRoot }}\packages\NUnitTestAdapter.1.2'
    runInParallel: false
    codeCoverageEnabled: true
    runSettingsFile: '${{ parameters.BuildRoot }}\CrossDomain.Integration\CodeCoverage.runsettings'
    platform: '$(BuildSolutionPlatform)'
    configuration: '$(BuildConfiguration)'
    rerunFailedTests: true
    rerunMaxAttempts: 1
    testRunTitle: 'Test: Contracts Acceptance Tests (only Long2Run A600 - A799)'
  continueOnError: true
  condition: and(succeeded(), eq(variables['RunAcceptanceTests'], 'Y'))

- task: VSTest@2
  displayName: 'Test: Contracts Acceptance Tests (only Long2Run A800 - A999 and A0XX)'
  inputs:
    testAssemblyVer2: |
     **\bin\$(BuildConfiguration)\Contracts.AcceptanceTests.dll
     !Build/drop/*
    testFiltercriteria: (TestCategory=AcceptanceTest&TestCategory=Complete&TestCategory=Long2Run890)
    pathtoCustomTestAdapters: '${{ parameters.BuildRoot }}\packages\NUnitTestAdapter.1.2'
    runInParallel: false
    codeCoverageEnabled: true
    runSettingsFile: '${{ parameters.BuildRoot }}\CrossDomain.Integration\CodeCoverage.runsettings'
    platform: '$(BuildSolutionPlatform)'
    configuration: '$(BuildConfiguration)'
    rerunFailedTests: true
    rerunMaxAttempts: 1
    testRunTitle: 'Test: Contracts Acceptance Tests (only Long2Run A800 - A999 and A0XX)'
  continueOnError: true
  condition: and(succeeded(), eq(variables['RunAcceptanceTests'], 'Y'))

- task: VSTest@2
  displayName: 'Test: Xrm Configuration Tests'
  inputs:
    testAssemblyVer2: |
     **\bin\$(BuildConfiguration)\Xrm.Configuration.Tests.dll
     !Build/drop/**
    testFiltercriteria: 'TestCategory=CRMConfiguration'
    pathtoCustomTestAdapters: '${{ parameters.BuildRoot }}\FCS.Worker'
    runInParallel: false
    codeCoverageEnabled: true
    runSettingsFile: '${{ parameters.BuildRoot }}\CrossDomain.Integration\CodeCoverage.runsettings'
    platform: '$(BuildSolutionPlatform)'
    configuration: '$(BuildConfiguration)'
    testRunTitle: 'Xrm Configuration Tests'
  continueOnError: true
  condition: and(succeeded(), eq(variables['RunCRMConfigTests'], 'Y'))

- task: VSTest@2
  displayName: 'Test: Contracts Acceptance Tests - CFS only'
  inputs:
    testAssemblyVer2: |
     **\bin\$(BuildConfiguration)\Contracts.AcceptanceTests.dll
     !Build/drop/*
    testFiltercriteria: (TestCategory=AcceptanceTest&TestCategory=Complete&TestCategory=CFS)
    pathtoCustomTestAdapters: '${{ parameters.BuildRoot }}\packages\NUnitTestAdapter.1.2'
    runInParallel: false
    codeCoverageEnabled: true
    runSettingsFile: '${{ parameters.BuildRoot }}\CrossDomain.Integration\CodeCoverage.runsettings'
    platform: '$(BuildSolutionPlatform)'
    configuration: '$(BuildConfiguration)'
    rerunFailedTests: true
    rerunMaxAttempts: 1
    testRunTitle: 'Test: Contracts Acceptance Tests - CFS only'
  continueOnError: true
  condition: and(succeeded(), eq(variables['CFS_Tests'], 'Y'))

# Fct Operations Unit Tests
- task: PowerShell@2
  displayName: 'Unpack Build Control file into variables'
  inputs:
    targetType: filePath
    filePath: ${{ parameters.BuildRoot }}/Build/Scripts/Build-UnpackBuildControlFile.ps1
    arguments:
      -configuration  $(Release.EnvironmentName)
      -buildRoot "${{ parameters.BuildRoot }}"
      -BCOverride '$(BC_Override)'
  continueOnError: false

- task: DotNetCoreCLI@2
  displayName: Restore Nuget for Operations .Net Core
  inputs:
    command: restore
    projects: '${{ parameters.BuildRoot }}/FCT.Operations/FCT.Operations.sln'
    feedsToUse: select
    includeNuGetOrg: true
    arguments: '--collect "Code Coverage"'
  condition: and(succeeded(), and(eq(variables['BC_OperationsWorker'], 'Y'), eq(variables['RunUnitTests'], 'Y')))

- task: NuGetCommand@2
  displayName: 'NuGet restore for Operations Core - Framework'
  inputs:
    restoreSolution: '${{ parameters.BuildRoot }}/FCS.Worker/FCS.Worker.B.sln'
    restoreDirectory: '${{ parameters.BuildRoot }}/packages'
  condition: and(succeeded(), and(eq(variables['BC_OperationsWorker'], 'Y'), eq(variables['RunUnitTests'], 'Y')))

- task: NuGetCommand@2
  displayName: 'NuGet restore for Operations Core - Framework CDA'

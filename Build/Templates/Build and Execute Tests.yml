    command: test
    projects: '${{ parameters.BuildRoot }}/FCT.Operations/Operations.Worker.Tests/Operations.Worker.Tests.csproj'
    arguments: '--configuration $(BuildConfiguration) --filter TestCategory=UnitTest --collect "Code Coverage"'
  condition: and(succeeded(), and(eq(variables['BC_OperationsWorker'], 'Y'), eq(variables['RunUnitTests'], 'Y')))

- task: VSBuild@1
  displayName: 'Build Operations - CDA Framework code'
  inputs:
    solution: '${{ parameters.BuildRoot }}/FCT.Operations/Fct.Operations.Cda.Tests/FCT.Operations.Cda.Tests.csproj'
    platform: '$(BuildPlatform)'
    configuration: '$(BuildConfiguration)'
  condition: and(succeeded(), and(eq(variables['BC_OperationsWorker'], 'Y'), eq(variables['RunUnitTests'], 'Y')))

- task: VSBuild@1
  displayName: 'Build Operations - Integrity Framework code'
  inputs:
    solution: '${{ parameters.BuildRoot }}/FCT.Operations/FCT.Operations.Integrity.Tests/FCT.Operations.Integrity.Tests.csproj'
    platform: '$(BuildPlatform)'
    configuration: '$(BuildConfiguration)'
  condition: and(succeeded(), and(eq(variables['BC_OperationsWorker'], 'Y'), eq(variables['RunUnitTests'], 'Y')))

- task: VSBuild@1
  displayName: 'Build Operations - Maintenance Framework code'
  inputs:
    solution: '${{ parameters.BuildRoot }}/FCT.Operations/FCT.Operations.Maintenance.Endpoint.Tests/FCT.Operations.Maintenance.Endpoint.Tests.csproj'
    platform: '$(BuildPlatform)'

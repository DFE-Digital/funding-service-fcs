parameters:
  BuildRoot: ''
  ArtifactFeedName: ''
  ShouldBuild: ''

steps:

- task: NuGetToolInstaller@1
  displayName: 'Use NuGet 5.4.0'
  inputs:
    versionSpec: 5.4.0
  condition: and(succeeded(), ne(variables['FunctionAppDeployment'],'Y'), or(eq(variables['RunAcceptanceTests'], 'Y'), eq(variables['RunIntegrationTests'], 'Y'), eq(variables['RunIntegrationTestsNightlyBuild'], 'Y'), eq(variables['RunCleanUpTests'], 'Y'), eq(variables['RunCRMConfigTests'], 'Y'), eq(variables['BuildAcceptanceTests'], 'Y')))

- task: NuGetToolInstaller@1
  displayName: 'Use NuGet 6.0.0'
  inputs:
    versionSpec: 6.0.0
  condition: and(succeeded(), eq(variables['FunctionAppDeployment'],'Y'), or(eq(variables['RunAcceptanceTests'], 'Y'), eq(variables['RunIntegrationTests'], 'Y'), eq(variables['RunIntegrationTestsNightlyBuild'], 'Y'), eq(variables['RunCleanUpTests'], 'Y'), eq(variables['RunCRMConfigTests'], 'Y'), eq(variables['BuildAcceptanceTests'], 'Y')))

# - task: NuGetCommand@2
#   displayName: 'NuGet restore for Contracts.AcceptanceTests'
#   inputs:
#     restoreSolution: 'Contracts.AcceptanceTests\Contracts.AcceptanceTests.sln'
#     restoreDirectory: '${{ parameters.BuildRoot }}/packages'
#   condition: and(succeeded(), or(eq(variables['RunAcceptanceTests'], 'Y'), eq(variables['BuildAcceptanceTests'], 'Y')))

- task: DotNetCoreCLI@2
  displayName: 'Restore NuGet packages for Contracts.AcceptanceTests'
  inputs:
    command: 'restore'
    projects: 'Contracts.AcceptanceTests\Contracts.AcceptanceTests.sln'
    feedsToUse: 'select'
    includeNuGetOrg: true
  condition: and(succeeded(), or(eq(variables['RunAcceptanceTests'], 'Y'), eq(variables['BuildAcceptanceTests'], 'Y')))

- task: PowerShell@2
  displayName: 'Diagnose Contracts.AcceptanceTests project XML and MSBuild'
  inputs:
    targetType: inline
    script: |
      $project = Get-ChildItem -Path "$(Build.SourcesDirectory)\Contracts.AcceptanceTests" -Recurse -Filter 'Contracts.AcceptanceTests.csproj' | Select-Object -First 1
      if ($null -eq $project) {
          throw 'Contracts.AcceptanceTests.csproj was not found under $(Build.SourcesDirectory)\Contracts.AcceptanceTests'
      }

      Write-Host "Project path: $($project.FullName)"
      Get-Content -LiteralPath $project.FullName -TotalCount 5

      $msbuildPath = 'C:\Program Files\Microsoft Visual Studio\2022\Enterprise\MSBuild\Current\Bin\MSBuild.exe'
      if (-not (Test-Path $msbuildPath)) {
          throw "Visual Studio 2022 MSBuild was not found at $msbuildPath"
      }

      Write-Host "MSBuild path: $msbuildPath"
      & $msbuildPath -version
  condition: and(succeeded(), or(eq(variables['RunAcceptanceTests'], 'Y'), eq(variables['BuildAcceptanceTests'], 'Y')))

- task: PowerShell@2
  displayName: 'Build solution Contracts.AcceptanceTests.sln'
  inputs:
    targetType: inline
    script: |
      $msbuildPath = 'C:\Program Files\Microsoft Visual Studio\2022\Enterprise\MSBuild\Current\Bin\MSBuild.exe'
      $solutionPath = Join-Path '$(Build.SourcesDirectory)' 'Contracts.AcceptanceTests\Contracts.AcceptanceTests.sln'
      $msbuildArgs = @(
          $solutionPath,
          '/nologo',
          '/nr:false',
          '/p:Platform=$(BuildSolutionPlatform)',
          '/p:Configuration=$(BuildConfiguration)'
      )

      & $msbuildPath @msbuildArgs
      if ($LASTEXITCODE -ne 0) {
          throw "MSBuild failed with exit code $LASTEXITCODE"
      }
  condition: and(succeeded(), or(eq(variables['RunAcceptanceTests'], 'Y'), eq(variables['BuildAcceptanceTests'], 'Y')))

- powershell: |
    $msbuildPath = "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\MSBuild\Current\Bin\MSBuild.exe"

    Write-Host "Checking Visual Studio MSBuild:"
    Write-Host $msbuildPath

    if (-not (Test-Path $msbuildPath)) {
        Write-Error "MSBuild.exe was not found at $msbuildPath"
        exit 1
    }

    & $msbuildPath -version

    $msbuildDirectory = Split-Path $msbuildPath
    Write-Host "##vso[task.prependpath]$msbuildDirectory"
  displayName: 'Configure Visual Studio MSBuild'

- task: NuGetCommand@2
  displayName: 'NuGet restore for **/*.B.sln'
  inputs:
    restoreSolution: '**\*.B.sln'
    restoreDirectory: '${{ parameters.BuildRoot }}/packages'
  condition: and(succeeded(), or(eq(variables['RunIntegrationTests'], 'Y'), eq(variables['RunIntegrationTestsNightlyBuild'], 'Y'), eq(variables['RunCleanUpTests'], 'Y'), eq(variables['RunCRMConfigTests'], 'Y')))

- task: PowerShell@2
  displayName: 'Build all solutions with tests (*.B.sln)'
  inputs:
    targetType: inline
    script: |
      $msbuildPath = 'C:\Program Files\Microsoft Visual Studio\2022\Enterprise\MSBuild\Current\Bin\MSBuild.exe'
      $solutions = Get-ChildItem -Path '$(Build.SourcesDirectory)' -Recurse -Filter '*.B.sln'
      if (-not $solutions) {
          throw 'No .B.sln files were found under $(Build.SourcesDirectory)'
      }

      foreach ($solution in $solutions) {
          Write-Host "Building solution: $($solution.FullName)"
          $msbuildArgs = @(
              $solution.FullName,
              '/nologo',
              '/nr:false',
              '/p:Platform=$(BuildSolutionPlatform)',
              '/p:Configuration=$(BuildConfiguration)'
          )

          & $msbuildPath @msbuildArgs
          if ($LASTEXITCODE -ne 0) {
              throw "MSBuild failed for $($solution.FullName) with exit code $LASTEXITCODE"
          }
      }
  condition: and(succeeded(), or(eq(variables['RunIntegrationTestsNightlyBuild'], 'Y'), eq(variables['RunCleanUpTests'], 'Y'), eq(variables['RunCRMConfigTests'], 'Y')))

- task: DotNetCoreCLI@2
  displayName: 'Restore OrganisationDomain .NET 8'
  inputs:
    command: 'restore'
    projects: '${{ parameters.BuildRoot }}/OrganisationDomain/OrganisationDomain.B.sln'
    feedsToUse: 'select'
    includeNuGetOrg: true
  condition: and(succeeded(), eq(variables['BC_OrgDomain'], 'Y'), eq(variables['RunIntegrationTests'],'Y'))

- task: PowerShell@2
  displayName: 'Build OrganisationDomain with tests'
  inputs:
    targetType: inline
    script: |
      $msbuildPath = 'C:\Program Files\Microsoft Visual Studio\2022\Enterprise\MSBuild\Current\Bin\MSBuild.exe'
      $solutionPath = Join-Path '$(Build.SourcesDirectory)' 'OrganisationDomain\OrganisationDomain.B.sln'
      $msbuildArgs = @(
          $solutionPath,
          '/nologo',
          '/nr:false',
          '/p:Platform=$(BuildSolutionPlatform)',
          '/p:Configuration=$(BuildConfiguration)'
      )

      & $msbuildPath @msbuildArgs
      if ($LASTEXITCODE -ne 0) {
          throw "MSBuild failed with exit code $LASTEXITCODE"
      }
  condition: and(succeeded(), eq(variables['BC_OrgDomain'], 'Y'), eq(variables['RunIntegrationTests'],'Y'))

- task: DotNetCoreCLI@2
  displayName: 'Test: .NET Core Tests'
  inputs:
    command: test
    projects: '**/*Tests/FundingAllocation.Tests.csproj'
    arguments: '--configuration $(BuildConfiguration) --filter TestCategory=UnitTest|TestCategory=IntegrationTest --collect "Code Coverage"'
  condition: and(succeeded(), eq(variables['RunCoreTests'], 'Y'))

- task: DotNetCoreCLI@2
  displayName: 'Test: FctServices .NET Core Tests'
  inputs:
    command: test
    projects: '${{ parameters.BuildRoot }}/FCTServices/FCTServices.sln'
    arguments: '--configuration $(BuildConfiguration) --filter TestCategory=UnitTest|TestCategory=IntegrationTest --collect "Code Coverage"'
  condition: and(succeeded(), eq(variables['RunIntegrationTests'], 'Y'), eq(variables['BC_FCTServices'], 'Y'))

- task: VisualStudioTestPlatformInstaller@1
  inputs:
    packageFeedSelector: 'nugetOrg'
    versionSelector: 'latestStable'

- task: VSTest@2
  displayName: 'Test: Integration Tests'
  inputs:
    vsTestVersion: 'toolsInstaller'
    testAssemblyVer2: |
      **\$(BuildConfiguration)\**Tests.dll
      !**\obj\**
    testFiltercriteria: 'TestCategory=IntegrationTest'
    pathtoCustomTestAdapters: '$(System.DefaultWorkingDirectory)\CrossDomain.Integration'
    codeCoverageEnabled: true
    runSettingsFile: '${{ parameters.BuildRoot }}\CrossDomain.Integration\CodeCoverage.runsettings'
    platform: '$(BuildSolutionPlatform)'
    configuration: '$(BuildConfiguration)'
    rerunFailedTests: true
    testRunTitle: 'Integration Tests'
  env:
    FSC_DAT_APP_KEY: $(idaAppKeyFundingStreamConfig)
  continueOnError: false
  condition: and(succeeded(), eq(variables['RunIntegrationTests'], 'Y'))

- task: VSTest@2
  displayName: 'Test: Integration Tests Nightly Build'
  inputs:
    vsTestVersion: 'toolsInstaller'
    testAssemblyVer2: |
      **\$(BuildConfiguration)\**Tests.dll
      !**\obj\**
    testFiltercriteria: 'TestCategory=IntegrationTestNightlyBuild'
    pathtoCustomTestAdapters: '$(System.DefaultWorkingDirectory)\FCT.Console'
    codeCoverageEnabled: true
    runSettingsFile: '${{ parameters.BuildRoot }}\CrossDomain.Integration\CodeCoverage.runsettings'
    platform: '$(BuildSolutionPlatform)'
    configuration: '$(BuildConfiguration)'
    rerunFailedTests: true
    testRunTitle: 'Integration Tests Nightly Build'
  continueOnError: true
  condition: and(succeeded(), eq(variables['RunIntegrationTestsNightlyBuild'], 'Y'))

  #Murali Debug Start

- task: PowerShell@2
  displayName: 'Verify TeamSiteTests config'
  inputs:
    targetType: inline
    script: |
      Get-ChildItem "$(Build.SourcesDirectory)" -Recurse -Filter TeamSiteTests.dll.config

      Get-ChildItem "$(Build.SourcesDirectory)" -Recurse -Filter TeamSiteTests.dll.config |
      ForEach-Object {
          Write-Host "Found:" $_.FullName
          Get-Content $_.FullName
      }
#Murali Debug end

- task: VSTest@2
  displayName: 'Test: Clean up Tests'
  inputs:
    vsTestVersion: 'toolsInstaller'
    testAssemblyVer2: |
      **\bin\$(BuildConfiguration)\net8.0\**TeamSiteTests.dll
      !**\obj\**
      !Build/drop/**
    pathtoCustomTestAdapters: '${{ parameters.BuildRoot }}\FCS.Worker'
    runInParallel: false
    codeCoverageEnabled: true
    runSettingsFile: '${{ parameters.BuildRoot }}\CrossDomain.Integration\CodeCoverage.runsettings'
    platform: '$(BuildSolutionPlatform)'
    configuration: '$(BuildConfiguration)'
    testRunTitle: 'Clean up Tests'
  continueOnError: true
  condition: and(succeeded(), eq(variables['RunCleanUpTests'], 'Y'))

- powershell: |
    $adapterPath = "$(Build.SourcesDirectory)\TestAdapters"

    New-Item -ItemType Directory -Force -Path $adapterPath | Out-Null

    nuget install NUnitTestAdapter `
      -Version 2.3.0 `
      -OutputDirectory $adapterPath `
      -NonInteractive

    Write-Host "Installed NUnit adapter:"
    Get-ChildItem $adapterPath -Recurse -Filter "*.TestAdapter.dll" |
        Select-Object FullName
  displayName: 'Install NUnit Test Adapter 2.3.0'


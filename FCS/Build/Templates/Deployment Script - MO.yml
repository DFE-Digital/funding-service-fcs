  - task: PowerShell@2
    displayName: 'Replace CPDS Certificate Thumbprint - FCS Worker WorkerRole'
    inputs:
      targetType: 'inline'
      script: |
        $path = "$(Build.SourcesDirectory)\FCS.Worker\WorkerRole"
        $files = Get-ChildItem $path -Filter *.config -Recurse

        if (-not $env:CPDS_CERT_THUMBPRINT) {
            throw "CPDS_CERT_THUMBPRINT is empty. Check the Azure DevOps Library variable."
        }

        foreach ($file in $files) {
            Write-Host "Processing: $($file.FullName)"

            [xml]$xml = Get-Content $file.FullName -Raw

            $nodes = $xml.SelectNodes(
                "//*[local-name()='behavior' and @name='ClientCertificateCredential']/*[local-name()='clientCredentials']/*[local-name()='clientCertificate']"
            )

            if ($nodes.Count -gt 0) {
                foreach ($node in $nodes) {
                    $node.SetAttribute('findValue', $env:CPDS_CERT_THUMBPRINT)
                }

                $xml.Save($file.FullName)

                Write-Host "Certificate thumbprint updated."
            }
            else {
                Write-Host "No ClientCertificateCredential found - leaving file unchanged."
            }
        }
    env:
      CPDS_CERT_THUMBPRINT: $(fcscpdscertthumbprint)

  - task: PowerShell@2
    displayName: 'Replace CPDS Certificate Thumbprint - CrossDomain XDomain Worker'
    inputs:
      targetType: 'inline'
      script: |
        $path = "$(Build.SourcesDirectory)\CrossDomain.Integration\XDomain.Worker"
        $files = Get-ChildItem $path -Filter *.config -Recurse

        if (-not $env:CPDS_CERT_THUMBPRINT) {

      ClassicSubscription: 'SFA-FCS-Prod'
      ARMSubscription: 'SFA-FCS-Prod (ARM)'
      AppStorageAccount: 'fctappstoragerelease'
      AppNamePrefix: 'fcs-prd-'

  - template: 'Deploy App Services.yml'

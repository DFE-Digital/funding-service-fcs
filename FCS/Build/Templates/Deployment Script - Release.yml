  steps:
  - task: PowerShell@2
    displayName: 'Update AzureAppKey in CRM XML'
    inputs:
      targetType: 'inline'
      script: |
        Write-Host "Starting XML update..."
        $filePath = "$(Build.SourcesDirectory)\FCTCRMSolution\CrossDomain.XrmSolutionBuild\ConfigData\SystemConfigData.Release.xml"
        Write-Host "File path: $filePath"
        [xml]$xml = Get-Content $filePath
        $nodes = $xml.SelectNodes("//AzureAppKey")
        foreach ($node in $nodes) {
            $node.InnerText = "$(ContractManagementServiceAppkey)"
        }
        $xml.Save($filePath)
        Write-Host "Completed XML update"


# In the definition which includes this the following variables need to be defined:

#  BC_Override         :  (optional)  the json contents for restricted builds, see wiki entry for more
#  BuildConfiguration  :  (mandatory) DCI | DAT | DMO | DOAT | CI | AT | MO | OAT | Release
#  CRMDeploymentMode   :  (optional)  1-3 - default is 3 (normal build and deploy)
#  DeployAfterBuild    :  (optional)  Y | N - default is Y, anything other than N is taken as a Y
#  RunAcceptanceTests  :  (optional)  Y | N - default is N (must be exactly Y to run, anything else is a N including missing)
#  RunCleanUpTests     :  (optional)  Y | N - default is N  "
#  RunCRMConfigTests   :  (optional)  Y | N - default is N  "
#  RunIntegrationTests :  (optional)  Y | N - default is N  " 
#  RunUnitTests:       :  (optional)  Y | N - default is N  "
#  TestFilter          :  (optional, mandatory if RunAcceptanceTests is Y) eg: (TestCategory=AcceptanceTest&TestCategory=Complete)

trigger: none

name: $(Build.DefinitionName)-$(date:yyyyMMdd)$(rev:.r)

jobs:
- job: MainJob
  pool: $(BuildAgentPool)
  timeoutInMinutes: 150
  cancelTimeoutInMinutes: 1

  variables:
  - group: OAUTH CRMDeploy PreProd
  - group: PreProd kv
  - group: DOAT-KeyVault-Config
  - name: BuildPlatform
    value: AnyCPU
  - name: BuildSolutionPlatform
    value: Any CPU
  - name: Release.EnvironmentName
    value: $(BuildConfiguration)
  - name: SqlHost
    value: gy2thhzgc4
  - name: ArtifactFeedName
    value: FCT/RB1
  - name: ShouldBuild
    value: N
  - name: NServiceBus/Transport
    value: $(NServiceBusTransport)
  - name: NServiceBus/Persistence
    value: $(fcsPaaSDBConnectionstring)
  - name: organisationDomainDatabase
    value: $(fcsPaaSDBConnectionstring)
  - name: AllocationDeliveryDbContext
    value: $(fcsPaaSDBConnectionstring)
  - name: AllocationDeliveryMonitoringDbContext
    value: $(fcsPaaSDBConnectionstring)
  - name: ContractCreateDbContext
    value: $(fcsPaaSDBConnectionstring)
  - name: ContractRequestDbContext
    value: $(fcsPaaSDBConnectionstring)
  - name: DocumentsDomainDbContext
    value: $(fcsPaaSDBConnectionstring)
  - name: OperationsDbContext
    value: $(fcsPaaSDBConnectionstring)
  - name: PaymentGenerationDbContext
    value: $(fcsPaaSDBConnectionstring)
  - name: PaymentManagementPolicyContext
    value: $(fcsPaaSDBConnectionstring)
  - name: PaymentSchedulePolicyContext
    value: $(fcsPaaSDBConnectionstring)
  - name: PaymentGenDBContext
    value: $(fcsPaaSDBConnectionstring)
  - name: ContractManagementDbContext
    value: $(fcsPaaSDBConnectionstring)
  - name: MonitoringDeliverablesDbContext
    value: $(fcsPaaSDBConnectionstring)
  - name: PerformanceManagementDbContext
    value: $(fcsPaaSDBConnectionstring)
  - name: OverrideDateDBContext
    value: $(fcsPaaSDBConnectionstring)
  - name: ConnectionStrings.StorageConnectionString
    value: $(StorageConnectionString)
  - name: Environment.NoSqlConnectionString
    value: $(StorageConnectionString)
  - name: CommonStorageConnectionString
    value: $(StorageConnectionString)
  - name: Environment.NoSqlConnectionString
    value: $(StorageConnectionString)
  - name: ida:AppKey_OrgService
    value: $(idaAppKeyOrgService)
  - name: ida:AppKey_CrmOnline
    value: $(idaAppKeyCrmOnline)
  - name: ida:AppKey_ContractPublish
    value: $(idaAppKeyContractPublish)
  - name: ContractManagementService:AppKey
    value: $(ContractManagementServiceAppkey)
  - name: DCT:Oauth:ClientSecret
    value: $(DCTOauthClientSecret)
  - name: DCT:FundingClaims:Oauth:ClientSecret
    value: $(DCTFundingClaimsOauthClientSecret)
  - name: ida:UserPassword
    value: $(idaUserPassword)
  - name: ReportDelivery.Password
    value: $(ReportDeliveryPassword)
  - name: Sharepoint:Oauth:ClientSecret
    value: $(SharepointOauthClientSecret)
  - name: OrgService:AppKey
    value: $(idaAppKeyOrgService)
  - name: iKey
    value: $(Key)
  - name: CFS:ClientSecret
    value: $(CFSClientSecret)
  - name: ida:AppKey_FundingStreamConfig
    value: $(idaAppKeyFundingStreamConfig)
  - name: CRM-OAUTH-AppKey
    value: $(OAUTH-CRMDeploy-AppKey)
  - name: CRM-OAUTH-ClientID
    value: $(OAUTH-CRMDeploy-ClientId)
  - name: AzureAppKey
    value: $(ContractManagementServiceAppkey)
  - name: UkrlpApi:Subscription
    value: $(UkrlpApiSubscription)
  - name: UkrlpApi:ClientId
    value: $(UkrlpApiClientId)
  - name: UkrlpApi:ClientSecret
    value: $(UkrlpApiClientSecret)
  - name: UkrlpApi:Scope
    value: $(UkrlpApiScope)
  - name: UkrlpApi:Tenant
    value: $(UkrlpApiTenant)
  - name: ErrorWebhook:UrlXml
    value: $(ErrorWebhookUrlXml)
  - name: ErrorWebhook:Url
    value: $(ErrorWebhookUrl)
  - name: ErrorWebhook.Url.General
    value: $(ErrorWebhookUrl)
  - name: ErrorWebhook.Url.Cfs_Read
    value: $(ErrorWebhookUrl)
  - name: NServiceBus/License
    value: $(NServiceBusLicense)
  - name: ConnectionStrings.NServiceBus/License
    value: $(NServiceBusLicense) 

  steps:
  - checkout: self
    clean: true

  - task: FileTransform@1
    displayName: 'FCS.Worker- Update Key Vault Secrets'
    inputs:
      folderPath: '$(Build.SourcesDirectory)\FCS.Worker\'
      targetFiles: '**\*.config'
      fileType: xml

  - task: NuGetToolInstaller@1
    displayName: 'Use NuGet 5.4.0'
    inputs:
      versionSpec: 5.4.0
    condition: and(succeeded(),  ne(variables['FunctionAppDeployment'],'Y'))

  - task: NuGetToolInstaller@1
    displayName: 'Use NuGet 6.0.0'
    inputs:
      versionSpec: 6.0.0
    condition: and(succeeded(),  eq(variables['FunctionAppDeployment'],'Y'))

  - task: NuGetCommand@2
    displayName: 'NuGet restore FCS.Worker'
    inputs:
      restoreSolution: FCS.Worker/FCS.Worker.B.sln
      restoreDirectory: '$(Build.SourcesDirectory)\Packages'

  - task: VSBuild@1
    displayName: 'Build FCS Worker'
    inputs:
      solution: FCS.Worker/FCS.Worker.B.sln
      platform: '$(BuildSolutionPlatform)'
      configuration: '$(BuildConfiguration)'

  - task: VSTest@2
    displayName: 'Test: DataFixes_Automated'
    inputs:
      testAssemblyVer2: |
        **\$(BuildConfiguration)\*test*.dll
        !**\obj\**
        !**\$(BuildConfiguration)\lib\**
        !**\$(BuildConfiguration)\NServiceBus*.dll
        !**\$(BuildConfiguration)\Test*.dll
      testFiltercriteria: 'TestCategory=DataFixes_Automated'
      pathtoCustomTestAdapters: '$(System.DefaultWorkingDirectory)\CrossDomain.Integration'
      codeCoverageEnabled: false
      platform: '$(BuildSolutionPlatform)'
      configuration: '$(BuildConfiguration)'
      rerunFailedTests: true

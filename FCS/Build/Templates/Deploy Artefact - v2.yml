parameters:
  StageFolder: ''
  ClassicSubscription: ''
  AppStorageAccount: ''
  ARMSubscription: ''
  AppNamePrefix: ''

steps:

# Update config via FileTransform task.
- task: FileTransform@2
  condition: and(succeeded(), ne(variables['DeployAfterBuild'],'N'), eq(variables['BC_CrossDomainIntegration'], 'Y'))
  displayName: 'XDomain.Worker.config- Update Key Vault Secrets'
  inputs:
    folderPath: '$(Build.SourcesDirectory)\CrossDomain.Integration\CrossDomain.Integration.Azure.Deploy\obj\$(BuildConfiguration)\XDomain.Worker\'
    xmlTargetFiles: |
      **\*.config

- task: FileTransform@2
  condition: and(succeeded(), ne(variables['DeployAfterBuild'],'N'), eq(variables['BC_CrossDomainIntegration'], 'Y'))
  displayName: 'XDomain.Worker.config- Update Key Vault Secrets'
  inputs:
    folderPath: '$(Build.SourcesDirectory)\CrossDomain.Integration\XDomain.Worker\bin\$(BuildConfiguration)\'
    xmlTargetFiles: |
      **\*.config

- task: FileTransform@2
  condition: and(succeeded(), ne(variables['DeployAfterBuild'],'N'), eq(variables['BC_CrossDomainIntegration'], 'Y'))
  displayName: 'XDomain.Worker.config- Update Key Vault Secrets'
  inputs:
    folderPath: '$(Build.SourcesDirectory)\CrossDomain.Integration\XDomain.Worker\'
    xmlTargetFiles: |
      **\*.config

- task: FileTransform@2
  condition: and(succeeded(), ne(variables['DeployAfterBuild'],'N'), eq(variables['BC_CrossDomainIntegration'], 'Y'))
  displayName: 'XDomain.Worker.config- Update Key Vault Secrets'
  inputs:
    folderPath: '$(Build.SourcesDirectory)\CrossDomain.Integration\XDomain.Worker\obj\$(BuildConfiguration)\'
    xmlTargetFiles: |
      **\*.config

- task: FileTransform@2
  condition: and(succeeded(), ne(variables['DeployAfterBuild'],'N'), eq(variables['BC_CrossDomainIntegration'], 'Y'))
  displayName: 'XDomain.Worker.config- Update Key Vault Secrets'
  inputs:
    folderPath: '$(Build.SourcesDirectory)\CrossDomain.Integration\CrossDomain.Integration.Azure.Deploy\csx\$(BuildConfiguration)\roles\XDomain.Worker\approot\'
    xmlTargetFiles: |
      **\*.config

- task: FileTransform@2
  condition: and(succeeded(), ne(variables['DeployAfterBuild'],'N'), eq(variables['BC_CrossDomainIntegration'], 'Y'))
  displayName: 'XDomain.Worker.config- Update Key Vault Secrets'
  inputs:
    folderPath: '${{ parameters.StageFolder }}\CrossDomain.Integration.Azure.WorkerSite\CrossDomain.Integration.Azure.WorkerSite.zip'
    xmlTargetFiles: |
      **\*.config

# Unpack Build Control file into variables
- task: PowerShell@2
  condition: and(succeeded(), ne(variables['DeployAfterBuild'],'N'))
  displayName: 'Unpack Build Control file into variables'
  inputs:
    targetType: filePath
    filePath: ${{ parameters.StageFolder }}/../Build/Scripts/Deploy-UnpackBuildControlFile.ps1
    arguments: -configuration  $(Release.EnvironmentName) -stageFolder ${{ parameters.StageFolder }}
  continueOnError: false

# Stop the App Services
- task: AzureCLI@2
  displayName: Azure CLI - Stop app service webjobs
  inputs:
    azureSubscription: ${{ parameters.ARMSubscription }}
    scriptType: ps
    failOnStandardError: true
    scriptLocation: inlineScript
    inlineScript: |
      az webapp webjob continuous stop --webjob-name XDomainWorkerRole --name ${{parameters.AppNamePrefix}}$(Release.EnvironmentName)-app-x-cdi --resource-group ${{parameters.AppNamePrefix}}$(Release.EnvironmentName)-rg
      az webapp webjob continuous stop --webjob-name FCSWorkerRole --name ${{parameters.AppNamePrefix}}$(Release.EnvironmentName)-app-x-fcsworker --resource-group ${{parameters.AppNamePrefix}}$(Release.EnvironmentName)-rg
  condition: and(succeeded(), ne(variables['DeployAfterBuild'],'N'), eq(variables['BC_StopWorkers'], 'Y'))

# Deploy CRM Package (D365)
- task: PowerShell@2
  displayName: 'Deploy CRM Package (D365)'
  inputs:
    targetType: filePath
    filePath: '${{ parameters.StageFolder }}/FCTCRMSolution/DebugScripts/DeployTo-$(Release.EnvironmentName).ps1'
    arguments: '-ClientID "$(OAUTH-CRMDeploy-ClientId)" -AppKey "$(OAUTH-CRMDeploy-AppKey)"'
  continueOnError: false
  condition: and(succeeded(), ne(variables['DeployAfterBuild'],'N'), eq(variables['BC_CRM'], 'Y'))

# Unpack CrossDomain.Integration.Azure.Deploy cspkg
- task: PowerShell@2
  condition: and(succeeded(), ne(variables['DeployAfterBuild'],'N'), eq(variables['BC_CrossDomainIntegration'], 'Y'))
  displayName: 'Unpack CrossDomain.Integration.Azure.Deploy cspkg'
  inputs:
    targetType: filePath
    filePath: ${{ parameters.StageFolder }}/../Build/Scripts/Unpack_CSPKG_File.ps1
    arguments: -package "${{ parameters.StageFolder }}/CrossDomain.Integration.Azure.Deploy\CrossDomain.Integration.Azure.Deploy.cspkg" -outputVariable "CrossDomain.Integration.Azure.Deploy"

- task: FileTransform@2
  displayName: 'XDomain.Worker.config- Update Key Vault Secrets'
  condition: and(succeeded(), ne(variables['DeployAfterBuild'],'N'), eq(variables['BC_CrossDomainIntegration'], 'Y'))
  inputs:
    folderPath: '$(CrossDomain.Integration.Azure.Deploy)\'
    xmlTargetFiles: |
      **\*.config

# Execute Entity Framework Migrations - CDI -- commented out to test file transform task in MO
- task: PowerShell@2
  displayName: 'Execute Entity Framework Migrations - CDI'
  condition: and(succeeded(), ne(variables['DeployAfterBuild'],'N'), eq(variables['BC_CrossDomainIntegration'], 'Y'))
  inputs:
    targetType: filePath
    filePath: ${{ parameters.StageFolder }}/../Build/Scripts/PerformMigrations.ps1
    arguments: -migrationsFolder $(CrossDomain.Integration.Azure.Deploy) -stageFolder ${{ parameters.StageFolder }} -filter "^(.*\.DataStore.dll|AllocationDeliveryDomain.Common.dll)$" -configuration .\XDomain.Worker.exe.config

# Unpack Operations.Worker cspkg

# # Execute Entity Framework Migrations - Operations
# - task: PowerShell@2
#   displayName: 'Execute Entity Framework Migrations - Operations'
#   condition: and(succeeded(), ne(variables['DeployAfterBuild'],'N'), eq(variables['BC_OperationsWorker'], 'Y'))  
#   inputs:
#     targetType: filePath
#     filePath: ${{ parameters.StageFolder }}/../Build/Scripts/PerformMigrations.ps1
#     arguments:
#       -migrationsFolder $(Operations.Azure.Deploy)
#       -stageFolder ${{ parameters.StageFolder }}
#       -filter "^.*perations.DataStore.dll$"
#       -configuration .\Operations.Worker.exe.config

# DataFixes_Automated
- task: VSTest@2
  displayName: 'DataFixes_Automated'
  inputs:
    testAssemblyVer2: Datafix.Tests.dll
    searchFolder: '${{ parameters.StageFolder }}\Datafix.Tests'
    testFiltercriteria: 'TestCategory=DataFixes_Automated'
    pathtoCustomTestAdapters: '${{ parameters.StageFolder }}\Datafix.Tests'
    testRunTitle: 'DataFixes_Automated'
  continueOnError: false
  condition: and(succeeded(), ne(variables['DeployAfterBuild'],'N'),  eq(variables['BC_DataFixes'], 'Y'))

# CrmCopyDbSetup
- task: VSTest@2
  displayName: CrmCopyDbSetup
  inputs:
    testAssemblyVer2: Datafix.Tests.dll
    searchFolder: '${{ parameters.StageFolder }}\Datafix.Tests'
    testFiltercriteria: 'TestCategory=CrmCopyDbSetup'
    pathtoCustomTestAdapters: '${{ parameters.StageFolder }}\Datafix.Tests'
    testRunTitle: 'CrmCopyDbSetup'
  condition: and(succeeded(), ne(variables['DeployAfterBuild'],'N'),  eq(variables['BC_CrmCopyDbSetup'], 'Y'))

# Azure App Service Deploy: WebJobsHostSite
- task: AzureRmWebAppDeployment@4.240.2
  displayName: 'Azure App Service Deploy: WebJobsHostSite'
  inputs:
    azureSubscription: ${{ parameters.ARMSubscription }}
    WebAppName: 'fct-webjobs-$(Release.EnvironmentName)'
    packageForLinux: '${{ parameters.StageFolder }}/CrossDomain.Integration.Azure.WebJobsHostSite/CrossDomain.Integration.Azure.WebJobsHostSite.zip'
  condition: and(succeeded(), ne(variables['DeployAfterBuild'],'N'), eq(variables['BC_WebJobsHostSite'], 'Y'))

- task: FileTransform@2
  displayName: 'FCT.Console.Subscription - Update Key Vault Secrets'
  condition: and(succeeded(), ne(variables['DeployAfterBuild'],'N'), eq(variables['BC_Subscriptions'], 'Y'))
  inputs:
    folderPath: '${{ parameters.StageFolder }}\FCT.Console.Subscription\'
    xmlTargetFiles: |
      **\*.config

# Create Missing Subscriptions for FCS.Worker, CDI, Operations and FcsCore
- script: |
    cd ${{ parameters.StageFolder }}\FCS.Worker\WorkerRole 
    ${{ parameters.StageFolder }}/FCT.Console.Subscription/FCT.Console.Subscription.exe
    cd ${{ parameters.StageFolder }}\CrossDomain.Integration\XDomain.Worker
    ${{ parameters.StageFolder }}/FCT.Console.Subscription/FCT.Console.Subscription.exe
    cd ${{ parameters.StageFolder }}\FCT.Operations\Operations.Worker
    ${{ parameters.StageFolder }}/FCT.Console.Subscription/FCT.Console.Subscription.exe
    ${{ parameters.StageFolder }}\FCT.Console.Subscription\FCT.Console.Subscription.exe /FcsCore
  displayName: 'Create Missing Subscriptions for FCS.Worker/CDI/Operation and FcsCore'
  condition: and(succeeded(), ne(variables['DeployAfterBuild'],'N'), eq(variables['BC_Subscriptions'], 'Y'))

- task: FileTransform@2
  displayName: 'FCT.Console.Config Utility- Update Key Vault Secrets'
  #condition: and(succeeded(), ne(variables['DeployAfterBuild'],'N'), eq(variables['BC_CrossDomainIntegration'], 'Y'))
  condition: and(succeeded(), ne(variables['DeployAfterBuild'],'N'), eq(variables['BC_Config'], 'Y'))
  inputs:
    folderPath: '${{ parameters.StageFolder }}/FCT.Console.Config\'
    xmlTargetFiles: |
      **\*.config

# Run the FCT.Console.Config Utility
- script: |
    ${{ parameters.StageFolder }}/FCT.Console.Config/FCT.Console.Config.exe

  workingDirectory: '${{ parameters.StageFolder }}/FCT.Console.Config'
  displayName: 'Run the FCT.Console.Config Utility'
  condition: and(succeeded(), ne(variables['DeployAfterBuild'],'N'), eq(variables['BC_Config'], 'Y'))

- task: FileTransform@2
  displayName: 'FCT.Console.Config - Template Upload- Update Key Vault Secrets'
  condition: and(succeeded(), ne(variables['DeployAfterBuild'],'N'), eq(variables['BC_DocumentTemplates'], 'Y'))
  inputs:
    folderPath: '${{ parameters.StageFolder }}/FCT.Console.Config\'
    xmlTargetFiles: |
      **\*.config
    # Run the FCT.Console.Config Utility for templates only
- script: |
    ${{ parameters.StageFolder }}/FCT.Console.Config/FCT.Console.Config.exe /T

  workingDirectory: '${{ parameters.StageFolder }}/FCT.Console.Config'
  displayName: 'FCT.Console.Config - Template Upload'
  condition: and(succeeded(), ne(variables['DeployAfterBuild'],'N'), eq(variables['BC_DocumentTemplates'], 'Y'))

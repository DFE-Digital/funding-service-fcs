# In the definition which includes this the following variables need to be defined:

#  BC_Override                     :  (optional)  the json contents for restricted builds, see wiki entry for more
#  BuildConfiguration              :  (mandatory) DCI | DAT | DMO | DOAT | CI | AT | MO | OAT | Release
#  CRMDeploymentMode               :  (optional)  1-3 - default is 3 (normal build and deploy)
#  DeployAfterBuild                :  (optional)  Y | N - default is Y, anything other than N is taken as a Y
#  RunAcceptanceTests              :  (optional)  Y | N - default is N (must be exactly Y to run, anything else is a N including missing)
#  RunCleanUpTests                 :  (optional)  Y | N - default is N  "
#  RunCRMConfigTests               :  (optional)  Y | N - default is N  "
#  RunIntegrationTests             :  (optional)  Y | N - default is N  "
#  RunIntegrationTestsNightlyBuild :  (optional)  Y | N - default is N  "
#  RunUnitTests:                   :  (optional)  Y | N - default is N  "
#  TestFilter                      :  (optional, mandatory if RunAcceptanceTests is Y) eg: (TestCategory=AcceptanceTest&TestCategory=Complete)


<div *ngIf="dateLastRefreshed" class="text-right">Last checked: {{ dateLastRefreshed | date: "MMMM d 'at' h:mm:ss a"}}&nbsp;</div>

<div>
      <div *ngFor="let notification of notifications" class="alert" [ngClass]="{'alert-danger': notification.isError(), 'alert-info': !notification.isError()}">      
            <h4>{{notification.NotificationName}}<br><small>{{notification.Description}}</small></h4>
      </div>
      <table class="table table-striped">
            <thead>
                  <tr>
                        <th class="service-min-width">Service Name</th>
                        <th class="text-nowrap">Is Available</th>
                        <th class="service-desc">Issue Description</th>
                  </tr>
            </thead>
            <tbody>
                  <tr *ngFor="let checkResult of checkResults" [ngClass]="{'text-danger': !checkResult.IsAvailable && checkResult.IsDataFresh()}" title="{{checkResult.SupplementaryInfo}}"  [ngClass]="{'mouse-pointer': checkResult.SupplementaryInfo}">
                        <td>
                              {{checkResult.ServiceName}}
                        </td>
                        <td>
                              <div *ngIf="checkResult.IsDataFresh(); else showRefreshing">
                                    <div *ngIf="checkResult.IsAvailable; else showFailure">
                                                <i class="fa fa-check" aria-hidden="true"></i>
                                    </div>
                                    <ng-template #showFailure>
                                          <i class="fa fa-times" aria-hidden="true"></i>
                                    </ng-template>
                              </div>
                              <ng-template #showRefreshing>
                                    <i class="fa fa-refresh fa-spin"></i>
                              </ng-template>
                        </td>
                        <td>
                              <div *ngIf="!checkResult.IsAvailable">
                                    {{ checkResult.Details }}
                              </div>
                        </td>
                  </tr>
            </tbody>
      </table>
</div>

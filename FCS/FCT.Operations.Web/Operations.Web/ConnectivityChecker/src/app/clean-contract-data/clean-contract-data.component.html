<div class="atom-feed-page">
  <p>Clean Contract Data</p>
  <textarea [(ngModel)]="fundingID" rows="6" placeholder="Enter Funding IDs here"></textarea>
  <br>
    <br>
      <button (click)="prepareFundingIDList()" type="submit" class="btn btn-primary pull-right" [disabled]="!fundingID.trim()">Submit</button>

      @if (statusMessage) {
        <div [class]="statusClass">{{statusMessage}}</div>
      }
    </div>

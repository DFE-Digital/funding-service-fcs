<div class="atom-feed-page">
    <div>
        <form (ngSubmit)="onSearch(contractNumber)" #loginForm="ngForm">
            <div class="form-group">
                <p for="name">Search the Atom Feed for a Contract</p>
                <input type="text" class="form-control" id="name" required [(ngModel)]="contractNumber" name="token"
                    #name="ngModel" placeholder="Enter Contract Number">
            </div>
            <button type="submit" class="btn btn-primary pull-right" [ngClass]='{disabled: !isOkToSearch(contractNumber)}'>Search</button>
            <br>
            <br>
            <div *ngIf="hasSearchBeenClicked">
                <div *ngIf="!loading; else showRefreshing">
                    <table class="table table-striped table-bordered">
                        <thead>
                            <tr>
                                <th class="service-min-width">Contract Number</th>
                                <th class="service-min-width">Version</th>
                                <th class="service-min-width">Sub Version</th>
                                <th class="service-min-width">Type</th>
                                <th class="service-min-width">Date</th>
                                <th class="service-min-width"></th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr *ngFor="let contract of contracts">
                                <td> {{contract.ContractNumber}} </td>
                                <td> {{contract.Version}} </td>
                                <td> {{contract.SubVersion}} </td>
                                <td> {{contract.ItemTypeString}} </td>
                                <td> {{contract.CreatedDateString}} </td>
                                <td> <a href='#' (click)="getXmlForContractId($event, contract)">Download</a> </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                <ng-template #showRefreshing>
                    <i class="fa fa-refresh fa-spin"></i>
                </ng-template>
                <br>
            </div>
        </form>
    </div>
</div>

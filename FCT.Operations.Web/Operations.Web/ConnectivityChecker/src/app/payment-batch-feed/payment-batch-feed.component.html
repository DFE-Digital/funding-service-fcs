<div class="atom-feed-page">
    <div>
        <form (ngSubmit)="onSearch(fundingStreamPeriod)" #loginForm="ngForm">
            <div class="form-group">
                <p for="name">Search the Payment Batch Feed for an Item</p>
                <input type="text" class="form-control" id="name" required [(ngModel)]="fundingStreamPeriod" name="token"
                    #name="ngModel" placeholder="Enter Funding Stream Period">
            </div>
            <button type="submit" class="btn btn-primary pull-right" [ngClass]='{disabled: !isOkToSearch(fundingStreamPeriod)}'>Search</button>
            <br>
            <br>
            <div *ngIf="hasSearchBeenClicked">
                <div *ngIf="!loading; else showRefreshing">
                    <table class="table table-striped table-bordered">
                        <thead>
                            <tr>
                                <th class="service-min-width">Funding Stream Period</th>
                                <th class="service-min-width">Payment Period</th>
                                <th class="service-min-width">Census Date</th>
                                <th class="service-min-width">Created Date</th>
                                <th class="service-min-width"></th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr *ngFor="let item of items">
                                <td> {{item.FundingStreamPeriod}} </td>
                                <td> {{item.PaymentPeriod}} </td>
                                <td> {{item.CensusEndDate}} </td>
                                <td> {{item.CreatedDate}} </td>
                                <td> <a href='#' (click)="getXmlForContractId($event, item)">Download</a> </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                <ng-template #showRefreshing>
                    <i class="fa fa-refresh fa-spin"></i>
                </ng-template>
                <br>
            </div>
        </form>
    </div>
</div>
